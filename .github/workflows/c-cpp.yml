name: Docker CI

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and Run Tests
        run: |
          # Avvia il database e compila l'app/test
          docker compose up --build -d
          
          # Esegue i test all'interno del container dell'app
          # Assumendo che il servizio nel compose si chiami 'app'
          docker compose exec -T app make test
